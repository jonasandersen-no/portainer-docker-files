services:
  homepage:
    restart: unless-stopped
    image: ghcr.io/gethomepage/homepage:v1.13.2
    container_name: homepage
    environment:
      HOMEPAGE_ALLOWED_HOSTS: dashboard.jonasandersen.dev # required, may need port. See gethomepage.dev/installation/#homepage_allowed_hosts
    networks:
      - proxy
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.dashboard.rule=Host(`dashboard.jonasandersen.dev`)
        - traefik.http.services.dashboard.loadbalancer.server.port=3000
        - traefik.http.routers.dashboard.entrypoints=http,https
    volumes:
      - /mnt/nas/prod/dashboard/config:/app/config
networks:
  proxy:
    external: true