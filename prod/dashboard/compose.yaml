services:
  homarr:
    container_name: homarr
    image: ghcr.io/homarr-labs/homarr:v1.76.0
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Optional, only if you want docker integration
      - /mnt/nas/prod/homarr/appdata:/appdata
    environment:
      - SECRET_ENCRYPTION_KEY=$HOMARR_SECRET_ENCRYPTION_KEY
    networks:
      - proxy
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.dashboard.rule=Host(`dashboard.jonasandersen.dev`)
        - traefik.http.services.dashboard.loadbalancer.server.port=7575
        - traefik.http.routers.dashboard.entrypoints=http,https
    dns:
      - 100.100.100.100
networks:
  proxy:
    external: true