services:
  tunnel:
    restart: unless-stopped
    image: cloudflare/cloudflared:2026.7.3
    command: tunnel --loglevel debug --config /etc/cloudflared/config/config.yaml run
    volumes:
      - /mnt/nas/prod/cloudflared-credentials/public:/etc/cloudflared/config
    networks:
      - cloudflared
networks:
  cloudflared:
    external: true