services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: always
#    ports:
#      - "3001:3001"  # This maps the container port "3001" to the host port "3001"
    volumes:
      - /opt/uptimekuma/data:/app/data  # Configuring persistent storage
    environment:
      - TZ=Europe/Oslo  # Set the timezone (change to your preferred local timezone so monitoring times are the same)
      - UMASK=0022
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.wiki.rule=Host(`status.jonasandersen.no`)
        - traefik.http.services.wiki.loadbalancer.server.port=3001
        - traefik.http.routers.wiki.entrypoints=http,https,http-external
      replicas: 1
      placement:
        constraints: [ node.hostname == proxy ]

networks:
  proxy:
    external: true